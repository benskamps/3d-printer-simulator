name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Build first: part of the suite asserts against the real Vite output in
      # dist/, and the production smoke runner reads the bundle it produces.
      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Smoke
        run: npm run smoke
